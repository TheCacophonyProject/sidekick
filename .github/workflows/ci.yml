---
name: Android CI/CD

on:
  push:

    branches:
      - update-sdk
    tags:
      - "v*.*.*" # Triggers only on tag pushes matching the pattern

jobs:
  deploy:
    name: Build and Deploy to Google Play
    runs-on: ubuntu-latest
    # if: startsWith(github.ref, 'refs/tags/')
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Project
        run: bun sync

      - name: Decrypt and Extract signing.tar.enc
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD_2 }}
        run: |
          # --batch and --pinentry-mode loopback fix the "ioctl" terminal issue
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_KEY_PASSWORD" \
            --output signing.tar signing.tar.enc
          
          tar xvf signing.tar
        working-directory: sidekick



      - name: Verify Decryption
        run: ls -la
        working-directory: sidekick

      - name: Configure Keystore
        run: |
          mkdir -p ~/.android
          cp keystore.properties ~/.android/keystore.properties
          cp android-keystore.jks ~/.android/android-keystore.jks
        working-directory: sidekick

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: >
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew Executable
        run: chmod +x ./gradlew
        working-directory: sidekick

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0" # Specify the Ruby version you need
          bundler-cache: true # Automatically caches gems

      - name: Build and Deploy with Fastlane
        working-directory: sidekick # Directory containing Fastfile
        run: bundle exec fastlane alpha
