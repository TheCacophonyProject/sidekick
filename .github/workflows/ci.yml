---
name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  android:
    name: Android Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor projects
        run: bun run sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decrypt Android signing bundle
        working-directory: sidekick
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 \
            -d -in signing.tar.enc -out signing.tar \
            -pass pass:"$SIGNING_KEY_PASSWORD"
          tar xf signing.tar
          rm signing.tar

      - name: Install Android signing assets
        working-directory: sidekick
        run: |
          cp keystore.properties ./keystore.properties
          cp android-keystore.jks ./android-keystore.jks
          mkdir -p fastlane && cp api.json fastlane/api.json
          rm -f keystore.properties android-keystore.jks


      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        working-directory: sidekick
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: sidekick

      - name: Publish Android bundle
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: "android release"
          subdirectory: sidekick
        env:
          ANDROID_KEYSTORE_PROPERTIES_PATH: ${{ github.workspace }}/sidekick/keystore.properties
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/sidekick/android-keystore.jks
          GOOGLE_PLAY_TRACK: closed
