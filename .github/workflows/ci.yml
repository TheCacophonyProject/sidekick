---
name: Mobile Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

jobs:
  android:
    name: Android Release
    runs-on: ubuntu-latest
    # if: startsWith(github.ref, 'refs/tags/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_NAME="${TAG#v}"
            MIN_SDK=23
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$(( MIN_SDK * 10000000 + MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor projects
        run: bun run sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decrypt Android signing bundle
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD_2 }}
        run: |
          # --batch and --pinentry-mode loopback fix the "ioctl" terminal issue
          gpg --quiet --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_KEY_PASSWORD" \
            --output signing.tar signing.tar.enc
          
          tar xvf signing.tar
          rm signing.tar
        working-directory: sidekick
      - name: Install Android signing assets
        run: |
          cp keystore.properties sidekick/keystore.properties
          cp android-keystore.jks sidekick/android-keystore.jks
          mkdir -p sidekick/fastlane && cp api.json sidekick/fastlane/api.json
          rm -f keystore.properties android-keystore.jks api.json


      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Make gradlew executable
        working-directory: sidekick
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Publish Android APK
        uses: maierj/fastlane-action@v3.1.0
        with:
          lane: "android release"
          subdirectory: sidekick
        env:
          ANDROID_KEYSTORE_PROPERTIES_PATH: ${{ github.workspace }}/sidekick/keystore.properties
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/sidekick/android-keystore.jks
          GOOGLE_PLAY_TRACK: alpha
          CI_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CI_VERSION_CODE: ${{ steps.version.outputs.version_code }}

  ios:
    name: iOS TestFlight
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_NAME="${TAG#v}"
            MIN_SDK=23
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$(( MIN_SDK * 10000000 + MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            echo "Unsupported tag format: $TAG" >&2
            exit 1
          fi
          {
            echo "IOS_VERSION_NAME=$VERSION_NAME"
            echo "IOS_BUILD_NUMBER=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        working-directory: sidekick
        run: chmod +x ./gradlew

      - name: Generate Kotlin shared framework
        working-directory: sidekick
        run: ./gradlew :shared:generateDummyFramework

      - name: Sync Capacitor projects
        run: bun run sync

      - name: Decrypt iOS signing bundle
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "SIGNING_KEY_PASSWORD secret is missing" >&2
            exit 1
          fi

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -d -in ios-auth.tar.enc -out ios-signing.tar \
            -pass pass:"$SIGNING_KEY_PASSWORD"

          tar xf ios-signing.tar
          rm -f ios-signing.tar

          signing_dir="ios-signing"
          if [ ! -d "$signing_dir" ]; then
            signing_dir="."
          fi

          mkdir -p sidekick/fastlane

          certificate_source=$(find "$signing_dir" -maxdepth 1 -name '*.p12' | head -n 1)
          profile_source=$(find "$signing_dir" -maxdepth 1 -name '*.mobileprovision' | head -n 1)
          api_key_source=$(find "$signing_dir" -maxdepth 1 -name '*.p8' | head -n 1)

          if [ -z "$certificate_source" ] || [ -z "$profile_source" ] || [ -z "$api_key_source" ]; then
            echo "Signing bundle is missing required files (.p12, .mobileprovision, .p8)" >&2
            exit 1
          fi

          cp "$certificate_source" sidekick/fastlane/distribution.p12
          cp "$profile_source" sidekick/fastlane/app.mobileprovision
          cp "$api_key_source" sidekick/fastlane/AuthKey.p8

          chmod 600 sidekick/fastlane/distribution.p12 sidekick/fastlane/AuthKey.p8

          if [ -d "ios-signing" ]; then
            rm -rf ios-signing
          fi

          {
            echo "IOS_CERT_PATH=$PWD/sidekick/fastlane/distribution.p12"
            echo "IOS_PROVISIONING_PROFILE_PATH=$PWD/sidekick/fastlane/app.mobileprovision"
            echo "APP_STORE_CONNECT_API_KEY_FILE=$PWD/sidekick/fastlane/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Publish to TestFlight
        working-directory: sidekick
        env:
          # Keychain and signing
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          # App Store Connect API key metadata (key file provided by decrypted bundle)
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: fastlane ios testflight
